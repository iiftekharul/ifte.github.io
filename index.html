<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Flipbook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 10;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .upload-btn {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    #imageInput {
      display: none;
    }

    /* Flipbook Container & 3D Setup */
    .viewport {
      perspective: 1500px;
      width: 100%;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book {
      width: 400px;
      height: 550px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      border-radius: 0 12px 12px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      border-radius: 0 12px 12px 0;
      overflow: hidden;
      background: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .page-face.back {
      transform: rotateY(180deg);
      border-radius: 12px 0 0 12px;
    }

    .page-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-text {
      color: #94a3b8;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    /* Controls */
    .controls {
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
    }

    .nav-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #334155;
    }

    .page-number {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    /* Flipped state */
    .page.flipped {
      transform: rotateY(-180deg);
    }
  </style>
</head>
<body>

  <header>
    <h1>3D Interactive Flipbook</h1>
    <label for="imageInput" class="upload-btn">Upload Images</label>
    <input type="file" id="imageInput" multiple accept="image/*">
  </header>

  <div class="viewport">
    <div class="book" id="book">
      <!-- Default Cover Page -->
      <div class="page" style="z-index: 1;">
        <div class="page-face front">
          <div class="placeholder-text">
            📷 Click "Upload Images" to create your 3D flipbook!
          </div>
        </div>
        <div class="page-face back"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn">Previous</button>
    <span class="page-number" id="pageCounter">Page 0 of 0</span>
    <button class="nav-btn" id="nextBtn">Next</button>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const book = document.getElementById('book');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageCounter = document.getElementById('pageCounter');

    let pages = [];
    let currentPageIndex = 0;

    imageInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      // Clear existing pages
      book.innerHTML = '';
      pages = [];
      currentPageIndex = 0;

      // Read images and generate double-sided pages
      const imageUrls = files.map(file => URL.createObjectURL(file));

      // Group images into pages (2 images per sheet: front and back)
      for (let i = 0; i < imageUrls.length; i += 2) {
        const frontImg = imageUrls[i];
        const backImg = imageUrls[i + 1] || null;

        const pageEl = document.createElement('div');
        pageEl.classList.add('page');
        
        // Front face
        const frontFace = document.createElement('div');
        frontFace.classList.add('page-face', 'front');
        const imgFront = document.createElement('img');
        imgFront.src = frontImg;
        frontFace.appendChild(imgFront);

        // Back face
        const backFace = document.createElement('div');
        backFace.classList.add('page-face', 'back');
        if (backImg) {
          const imgBack = document.createElement('img');
          imgBack.src = backImg;
          backFace.appendChild(imgBack);
        }

        pageEl.appendChild(frontFace);
        pageEl.appendChild(backFace);
        book.appendChild(pageEl);

        pages.push(pageEl);
      }

      updatePageZIndex();
      updateCounter();
    });

    function updatePageZIndex() {
      pages.forEach((page, index) => {
        if (index < currentPageIndex) {
          page.classList.add('flipped');
          page.style.zIndex = index;
        } else {
          page.classList.remove('flipped');
          page.style.zIndex = pages.length - index;
        }
      });
    }

    function updateCounter() {
      pageCounter.textContent = `Page ${currentPageIndex} of ${pages.length}`;
    }

    nextBtn.addEventListener('click', () => {
      if (currentPageIndex < pages.length) {
        currentPageIndex++;
        updatePageZIndex();
        updateCounter();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        updatePageZIndex();
        updateCounter();
      }
    });
  </script>

</body>
</html>
